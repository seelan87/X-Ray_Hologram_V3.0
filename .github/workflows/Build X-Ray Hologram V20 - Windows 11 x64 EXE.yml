name: Build X-Ray Hologram V3 - Windows 11 x64

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-x64:
    name: Windows 11 x64 EXE
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.10 x64
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify Python is 64-bit
        shell: pwsh
        run: |
          python --version
          python -c "import struct,platform; print('Python:', platform.python_version()); print('Architecture:', platform.architecture()[0]); print('Bits:', struct.calcsize('P')*8); assert struct.calcsize('P') == 8, 'Python is not 64-bit'"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build GUI-only EXE (no console window)
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue
          python -m PyInstaller --clean --noconfirm --noconsole X-Ray_Hologram_V20.spec

      - name: Find EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "dist" -Recurse -Filter "X-Ray_Hologram_V20.exe" -File |
                 Select-Object -First 1 -ExpandProperty FullName

          if (-not $exe) {
            Write-Host "dist contents:"
            Get-ChildItem -Path "dist" -Recurse -ErrorAction SilentlyContinue |
              Select-Object FullName, Length |
              Format-Table -AutoSize
            throw "X-Ray_Hologram_V20.exe was not created."
          }

          Write-Host "EXE found: $exe"
          "EXE_PATH=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Verify EXE is x64
        shell: pwsh
        run: |
          $exe = $env:EXE_PATH
          $bytes = [System.IO.File]::ReadAllBytes($exe)

          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "Not a Windows PE executable."
          }

          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $signature = [System.Text.Encoding]::ASCII.GetString($bytes, $peOffset, 4)

          if ($signature -ne "PE`0`0") {
            throw "Invalid PE signature."
          }

          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)

          if ($machine -ne 0x8664) {
            throw ("EXE is not x64/AMD64. Machine type: 0x{0:X4}" -f $machine)
          }

          Write-Host "Confirmed: Windows x64 / AMD64 EXE"

      - name: Package EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "$env:EXE_PATH" "package\X-Ray_Hologram_V20.exe" -Force

          Compress-Archive `
            -Path "package\X-Ray_Hologram_V20.exe" `
            -DestinationPath "X-Ray_Hologram_V20-Windows-x64.zip" `
            -Force

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v5
        with:
          name: X-Ray_Hologram_V20-Windows-x64
          path: X-Ray_Hologram_V20-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
