name: Build X-Ray Hologram V20 - Windows 11 x64 EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-x64:
    name: Windows 11 x64 EXE
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up 64-bit Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify 64-bit environment
        shell: pwsh
        run: |
          python --version
          python -c "import platform,struct; print('Architecture:', platform.architecture()[0]); print('Pointer size:', struct.calcsize('P')*8); assert struct.calcsize('P') == 8, 'Python is not 64-bit'"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install --upgrade pyinstaller

      - name: Verify scientific packages
        shell: pwsh
        run: |
          python -c "import numpy, scipy, pandas, h5py, PIL, matplotlib, skimage, imageio; print('Required imports: OK')"

      - name: Clean previous build
        shell: pwsh
        run: |
          if (Test-Path build) { Remove-Item build -Recurse -Force }
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }

      - name: Build x64 EXE
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm X-Ray_Hologram_V20.spec

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = "dist\X-Ray_Hologram_V20\X-Ray_Hologram_V20.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "ERROR: x64 EXE was not created."
            if (Test-Path dist) { Get-ChildItem dist -Recurse | Format-Table FullName,Length }
            exit 1
          }

          $size = (Get-Item $exe).Length
          Write-Host "SUCCESS: $exe"
          Write-Host ("EXE size: {0:N0} bytes" -f $size)

      - name: Package x64 EXE
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist\X-Ray_Hologram_V20\*" `
            -DestinationPath "X-Ray_Hologram_V20-Windows-x64.zip" `
            -Force

      - name: Upload x64 EXE
        uses: actions/upload-artifact@v5
        with:
          name: X-Ray_Hologram_V20-Windows-x64
          path: X-Ray_Hologram_V20-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
